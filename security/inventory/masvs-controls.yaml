  - id: MASVS-RESILIENCE-5
    category: MASVS-RESILIENCE
    title: Play Integrity / App Attest
    status: PARTIAL
    evidence: Deferred — threat-model item only

  - id: MASVS-PRIVACY-1
    category: MASVS-PRIVACY
    title: Clipboard sensitive data
    status: PASS
    evidence: No Clipboard usage in lib/

  - id: MASVS-PRIVACY-2
    category: MASVS-PRIVACY
    title: Notification payload minimization
    status: MANUAL_REVIEW
    evidence: In-app notifications; push payload review deferred

  - id: MASVS-PRIVACY-3
    category: MASVS-PRIVACY
    title: Sensitive debug logging redaction
    status: PASS
    evidence: RedactedLogInterceptor + SensitiveDataRedactor

  - id: MASVS-PRIVACY-4
    category: MASVS-PRIVACY
    title: iOS UIFileSharingEnabled
    status: PASS
    evidence: Not set in Info.plist — internal cache not exposed via Files app

  - id: MASVS-PRIVACY-5
    category: MASVS-PRIVACY
